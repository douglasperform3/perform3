<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1015">
<meta name="description" content="Perform3 — peças criativas para sua casa, seu trabalho e sua rotina.">
<link rel="icon" href="assets/perform3-mark.svg" type="image/svg+xml">
<title>perform3 | Peças e acessórios</title>
<style>
:root{color-scheme:dark;--bg:#0c0f11;--panel:rgba(12,15,17,.84);--panel-soft:rgba(24,28,30,.88);--text:#f2f1ee;--muted:#b8b8b2;--line:#ffffff20;--accent:#ed9140;--accent-soft:#ed91401b;--shadow:0 22px 64px #0008}
*{box-sizing:border-box}
html{min-height:100%;background:#0b1015}
body{position:relative;isolation:isolate;min-height:100vh;margin:0;padding:28px 18px 22px;display:grid;place-items:center;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);transition:color .25s}
/* Foto de fundo: Cemrecan Yurtman / Pexels — foto gratuita. */
.background-photo{position:fixed;inset:-18px;z-index:-1;pointer-events:none;background-color:#27221e;background-image:url("https://images.pexels.com/photos/40948538/pexels-photo-40948538.jpeg?auto=compress&cs=tinysrgb&w=1800");background-size:cover;background-position:64% center;background-repeat:no-repeat;filter:blur(7px);transform:scale(1.04)}
.background-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,15,17,.38) 0%,rgba(12,15,17,.28) 50%,rgba(12,15,17,.38) 100%),linear-gradient(180deg,rgba(12,15,17,.14) 0%,rgba(12,15,17,.08) 52%,rgba(12,15,17,.30) 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,transparent 0%,rgba(0,0,0,.22) 75%);z-index:0}
.page{position:relative;z-index:1;width:min(100%,540px);margin:auto}
.card{position:relative;overflow:hidden;padding:31px 32px 27px;text-align:center;border:1px solid var(--line);border-radius:20px;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow)}
.logo{display:block;width:min(100%,180px);height:auto;margin:2px auto 19px;object-fit:contain;image-rendering:auto;filter:none}
.tagline{max-width:350px;margin:0 auto 25px;color:var(--muted);font-size:14px;line-height:1.7}
.section-heading{display:flex;align-items:center;gap:12px;margin:0 0 13px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:none;text-align:left}
.section-heading:after{content:"";height:1px;flex:1;background:var(--line)}
.social-links,.social-grid{display:grid;gap:10px}
.link{display:flex;align-items:center;gap:13px;min-height:63px;padding:10px 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel-soft);color:var(--text);text-decoration:none;text-align:left;transition:transform .18s,border-color .18s,background .18s}
.link:hover{transform:translateY(-1px);border-color:#ed914080;background:#292522}
.link:focus-visible,.contact:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ico{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border:1px solid #ffffff14;border-radius:10px;background:#ffffff08;color:var(--text)}
.ico svg{width:21px;height:21px;display:block;fill:currentColor}
.ico.instagram{color:#e879ad}.ico.tiktok{color:var(--text)}.ico.youtube{color:#ff5252}
.copy{min-width:0;flex:1}.name{display:block;font-size:13px;font-weight:650;letter-spacing:.05px}.sub{display:block;margin-top:3px;color:var(--muted);font-size:11px}
.arrow{color:var(--muted);font-size:19px;transition:color .2s,transform .2s}.link:hover .arrow{color:var(--accent);transform:translate(2px,-2px)}
.contact-area{margin-top:23px}.contacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contact{min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-soft);color:var(--text);text-decoration:none;font-size:12px;font-weight:650;transition:background .18s,border-color .18s,transform .18s}
.contact:hover{transform:translateY(-1px);border-color:#ed914080;background:#292522}
.contact svg{width:16px;height:16px;fill:currentColor}.contact.mail svg{color:var(--accent)}.contact.whatsapp svg{color:#25c96a}
footer{margin-top:17px;color:#e5eaedb5;text-align:center;font-size:10px;letter-spacing:.25px;text-shadow:0 1px 5px #000}
@media(max-width:440px){body{padding:16px 12px;background-position:center;background-attachment:scroll}.card{padding:25px 17px 22px;border-radius:18px}.logo{width:min(100%,340px);margin-bottom:16px}.tagline{font-size:13px;margin-bottom:22px}.link{min-height:60px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<div class="background-photo" aria-hidden="true"></div>
<main class="page">
  <section class="card" aria-label="Perform3">
    <img class="logo" src="assets/perform3-logo.svg" alt="Perform3">
    <p class="tagline">Peças feitas com cuidado para deixar a rotina mais prática.</p>
    <p class="section-heading">Acompanhe a gente</p>
    <nav class="social-grid" aria-label="Redes sociais">
      <a class="link" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">

        <span class="ico tiktok" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M19.6 7.2a6.8 6.8 0 0 1-4.2-1.45v9.3a6.05 6.05 0 1 1-6.05-6.05c.4 0 .8.04 1.18.12v3.35a2.75 2.75 0 1 0 1.92 2.63V2h3.12a6.8 6.8 0 0 0 4.03 4.03v3.17Z"/></svg></span>
        <span class="copy"><span class="name">TikTok</span></span><span class="arrow" aria-hidden="true">↗</span>

      <a class="link" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">

        <span class="copy"><span class="name">YouTube</span></span><span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
    <div class="contact-area">
      <p class="section-heading">Quer conversar? Estamos por aqui.</p>
      <div class="contacts">
        <a class="contact mail" href="mailto:SEU-EMAIL@EXEMPLO.COM">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm9 8.2L3.5 6.5v11.4h17V6.5L12 12.2Zm0-2.4L20.5 6h-17l8.5 3.8Z"/></svg>
          E-mail
        </a>
        <a class="contact whatsapp" href="https://wa.me/55DDDNUMERO" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.52 3.48A11.83 11.83 0 0 0 12.1 0C5.55 0 .22 5.33.22 11.88c0 2.09.55 4.13 1.6 5.93L.12 24l6.34-1.66a11.9 11.9 0 0 0 5.64 1.43h.01c6.55 0 11.88-5.33 11.88-11.88 0-3.17-1.23-6.15-3.47-8.41ZM12.1 21.74h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.76.99 1-3.67-.24-.38a9.84 9.84 0 0 1-1.51-5.21c0-5.46 4.45-9.91 9.92-9.91 2.65 0 5.14 1.03 7.01 2.91a9.86 9.86 0 0 1 2.9 7c0 5.46-4.45 9.91-9.92 9.91Zm5.44-7.42c-.3-.15-1.77-.87-2.05-.97-.28-.1-.48-.15-.68.15-.2.3-.78.97-.95 1.17-.17.2-.35.23-.65.08-.3-.15-1.26-.46-2.4-1.46-.89-.79-1.49-1.77-1.67-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.68-1.64-.93-2.25-.24-.59-.49-.51-.68-.52h-.58c-.2 0-.52.08-.8.37-.28.3-1.05 1.03-1.05 2.51 0 1.48 1.08 2.91 1.23 3.11.15.2 2.13 3.25 5.16 4.56.72.31 1.28.5 1.72.64.72.23 1.37.2 1.89.12.58-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35Z"/></svg>

      </div>
    </div>
  </section>
  <footer>© <span id="year"></span> Perform3 · Todos os direitos reservados</footer>
</main>
<script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
