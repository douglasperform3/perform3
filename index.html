<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1015">
<meta name="description" content="Perform3 — peças criativas para sua casa, seu trabalho e sua rotina.">
<link rel="icon" href="assets/perform3-mark.svg" type="image/svg+xml">
<title>perform3 | Peças e acessórios</title>
<style>
:root{color-scheme:dark;--panel:rgba(11,16,21,.69);--panel-soft:rgba(20,28,35,.73);--text:#f4f6f7;--muted:#aab4ba;--line:#ffffff22;--accent:#f0a044;--accent-soft:#f0a04422;--shadow:0 28px 90px #0009}
[data-theme="light"]{color-scheme:light;--panel:rgba(247,249,250,.87);--panel-soft:rgba(255,255,255,.78);--text:#17232a;--muted:#5e6c75;--line:#1826302a;--accent:#a85d10;--accent-soft:#d9812023;--shadow:0 22px 75px #0b1b281c}
*{box-sizing:border-box}
html{min-height:100%;background:#0b1015}
body{position:relative;isolation:isolate;min-height:100vh;margin:0;padding:28px 18px 22px;display:grid;place-items:center;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);transition:color .25s}
.background-photo{position:fixed;inset:-12px;z-index:-1;pointer-events:none;background-image:url("https://images.pexels.com/photos/26841506/pexels-photo-26841506.jpeg?cs=srgb&dl=pexels-jakubzerdzicki-26841506.jpg&fm=jpg");background-size:cover;background-position:center;background-repeat:no-repeat;filter:blur(8px);transform:scale(1.035)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,transparent 0%,rgba(0,0,0,.22) 75%);z-index:0}
.page{position:relative;z-index:1;width:min(100%,540px);margin:auto}
.topbar{display:flex;justify-content:flex-end;margin-bottom:12px}
.theme-toggle{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:var(--panel);backdrop-filter:blur(12px);color:var(--muted);font:inherit;font-size:12px;font-weight:650;cursor:pointer;transition:border-color .2s,color .2s,transform .2s}
.theme-toggle:hover{border-color:var(--accent);color:var(--text);transform:translateY(-1px)}
.theme-toggle svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{position:relative;overflow:hidden;padding:34px 34px 27px;text-align:center;border:1px solid var(--line);border-radius:24px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.card:before{content:"";position:absolute;top:0;left:34px;width:46px;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.logo{display:block;width:min(100%,360px);height:auto;margin:5px auto 19px;filter:none}
.logo-light{display:none}
[data-theme="light"] .logo-dark{display:none}
[data-theme="light"] .logo-light{display:block}
.tagline{max-width:350px;margin:0 auto 27px;color:var(--muted);font-size:14px;line-height:1.65}
.section-heading{display:flex;align-items:center;gap:12px;margin:0 0 12px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;text-align:left}
.section-heading:after{content:"";height:1px;flex:1;background:var(--line)}
.social-links,.social-grid{display:grid;gap:10px}
.link{display:flex;align-items:center;gap:13px;min-height:65px;padding:11px 14px;border:1px solid var(--line);border-radius:13px;background:var(--panel-soft);color:var(--text);text-decoration:none;text-align:left;transition:transform .2s,border-color .2s,background .2s,box-shadow .2s}
.link:hover{transform:translateY(-2px);border-color:#f0a0448a;background:var(--accent-soft);box-shadow:0 10px 24px #0003}
.link:focus-visible,.contact:focus-visible,.theme-toggle:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ico{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:#ffffff08;color:var(--text)}
.ico svg{width:21px;height:21px;display:block;fill:currentColor}
.ico.instagram{color:#e879ad}.ico.tiktok{color:var(--text)}.ico.youtube{color:#ff5252}
.copy{min-width:0;flex:1}.name{display:block;font-size:13px;font-weight:780;letter-spacing:.15px}.sub{display:block;margin-top:3px;color:var(--muted);font-size:11px}
.arrow{color:var(--muted);font-size:19px;transition:color .2s,transform .2s}.link:hover .arrow{color:var(--accent);transform:translate(2px,-2px)}
.contact-area{margin-top:23px}.contacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contact{min-height:45px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel-soft);color:var(--text);text-decoration:none;font-size:12px;font-weight:750;transition:background .2s,border-color .2s,transform .2s}
.contact:hover{transform:translateY(-2px);border-color:var(--accent);background:var(--accent-soft)}
.contact svg{width:16px;height:16px;fill:currentColor}.contact.mail svg{color:var(--accent)}.contact.whatsapp svg{color:#25c96a}
footer{margin-top:17px;color:#e5eaedb5;text-align:center;font-size:10px;letter-spacing:.45px;text-shadow:0 1px 5px #000}
[data-theme="light"] footer{color:#fff}
@media(max-width:440px){body{padding:16px 12px;background-position:center;background-attachment:scroll}.card{padding:29px 19px 22px;border-radius:20px}.logo{width:min(100%,330px)}.tagline{font-size:13px;margin-bottom:23px}.link{min-height:62px}.topbar{margin-bottom:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<div class="background-photo" aria-hidden="true"></div>
<main class="page">
  <div class="topbar">
    <button class="theme-toggle" id="toggle" type="button" aria-label="Alternar tema">
      <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
      <span id="themeLabel">Tema claro</span>
    </button>
  </div>
  <section class="card" aria-label="Perform3">
    <img class="logo logo-dark" src="assets/perform3-logo.svg" alt="Perform3"><img class="logo logo-light" src="assets/perform3-logo-light.svg" alt="Perform3">
    <p class="tagline">Peças úteis e criativas para fazer parte da sua rotina.</p>
    <p class="section-heading">Siga a Perform3</p>
    <nav class="social-grid" aria-label="Redes sociais">
      <a class="link" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
        <span class="ico instagram" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.25-3.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5Z"/></svg></span>
        <span class="copy"><span class="name">Instagram</span></span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer">
        <span class="ico tiktok" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M19.6 7.2a6.8 6.8 0 0 1-4.2-1.45v9.3a6.05 6.05 0 1 1-6.05-6.05c.4 0 .8.04 1.18.12v3.35a2.75 2.75 0 1 0 1.92 2.63V2h3.12a6.8 6.8 0 0 0 4.03 4.03v3.17Z"/></svg></span>
        <span class="copy"><span class="name">TikTok</span></span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
        <span class="ico youtube" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.12C19.55 3.57 12 3.57 12 3.57s-7.55 0-9.4.51A3 3 0 0 0 .5 6.2 31.3 31.3 0 0 0 0 12a31.3 31.3 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.12c1.85.51 9.4.51 9.4.51s7.55 0 9.4-.51a3 3 0 0 0 2.1-2.12A31.3 31.3 0 0 0 24 12a31.3 31.3 0 0 0-.5-5.8ZM9.55 15.6V8.4L15.8 12l-6.25 3.6Z"/></svg></span>
        <span class="copy"><span class="name">YouTube</span></span><span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
    <div class="contact-area">
      <p class="section-heading">Fale com a gente</p>
      <div class="contacts">
        <a class="contact mail" href="mailto:SEU-EMAIL@EXEMPLO.COM">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm9 8.2L3.5 6.5v11.4h17V6.5L12 12.2Zm0-2.4L20.5 6h-17l8.5 3.8Z"/></svg>
          E-mail
        </a>
        <a class="contact whatsapp" href="https://wa.me/55DDDNUMERO" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.52 3.48A11.83 11.83 0 0 0 12.1 0C5.55 0 .22 5.33.22 11.88c0 2.09.55 4.13 1.6 5.93L.12 24l6.34-1.66a11.9 11.9 0 0 0 5.64 1.43h.01c6.55 0 11.88-5.33 11.88-11.88 0-3.17-1.23-6.15-3.47-8.41ZM12.1 21.74h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.76.99 1-3.67-.24-.38a9.84 9.84 0 0 1-1.51-5.21c0-5.46 4.45-9.91 9.92-9.91 2.65 0 5.14 1.03 7.01 2.91a9.86 9.86 0 0 1 2.9 7c0 5.46-4.45 9.91-9.92 9.91Zm5.44-7.42c-.3-.15-1.77-.87-2.05-.97-.28-.1-.48-.15-.68.15-.2.3-.78.97-.95 1.17-.17.2-.35.23-.65.08-.3-.15-1.26-.46-2.4-1.46-.89-.79-1.49-1.77-1.67-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.68-1.64-.93-2.25-.24-.59-.49-.51-.68-.52h-.58c-.2 0-.52.08-.8.37-.28.3-1.05 1.03-1.05 2.51 0 1.48 1.08 2.91 1.23 3.11.15.2 2.13 3.25 5.16 4.56.72.31 1.28.5 1.72.64.72.23 1.37.2 1.89.12.58-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35Z"/></svg>
          WhatsApp
        </a>
      </div>
    </div>
  </section>
  <footer>© <span id="year"></span> Perform3 · Todos os direitos reservados</footer>
</main>
<script>
const root=document.documentElement,button=document.getElementById('toggle'),label=document.getElementById('themeLabel'),icon=document.getElementById('themeIcon');
function setTheme(value){root.dataset.theme=value;label.textContent=value==='dark'?'Tema claro':'Tema escuro';icon.innerHTML=value==='dark'?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>':'<path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.6 8.6 0 1 0 20.5 14.2Z"/>';try{localStorage.setItem('perform3-theme',value)}catch(e){}}
let current='dark';try{current=localStorage.getItem('perform3-theme')||'dark'}catch(e){}setTheme(current);button.addEventListener('click',()=>setTheme(root.dataset.theme==='dark'?'light':'dark'));document.getElementById('year').textContent=new Date().getFullYear();
</script>
</body>
</html>
